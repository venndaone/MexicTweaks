<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MEXXIC Tweaks</title>
<style>
:root{
  --bg:#050505; --card:#0d0d0d; --card2:#111111; --card3:#161616;
  --b1:#1a1a1a; --b2:#222222; --b3:#2e2e2e; --b4:#3d3d3d;
  --w:#ffffff; --t:#f4f4f4; --m:#8a8a8a; --d:#555555;
  --mono:"Cascadia Mono","Consolas",monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:14px;user-select:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1000px 520px at 50% -180px,rgba(255,255,255,.055),transparent 70%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--t)}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#202020;border-radius:10px;border:3px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:#2c2c2c}
svg{display:block}

/* ============ brand ============ */
.brand{display:flex;flex-direction:column;line-height:1}
.brand .b1{font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;font-weight:800;letter-spacing:.2em;color:#fff;
  text-shadow:0 0 14px rgba(255,255,255,.38),0 0 40px rgba(255,255,255,.14);animation:glow 4.5s ease-in-out infinite}
.brand .b2{font-weight:500;color:#e8e8e8;letter-spacing:.42em;text-transform:uppercase}
@keyframes glow{50%{text-shadow:0 0 18px rgba(255,255,255,.5),0 0 54px rgba(255,255,255,.2)}}
.brand.lg .b1{font-size:64px;padding-left:.2em}
.brand.lg .b2{font-size:14px;margin-top:14px;padding-left:.42em;color:#bdbdbd}
.brand.sm .b1{font-size:28px}
.brand.sm .b2{font-size:10.5px;margin-top:6px;color:#9a9a9a}

/* ============ buttons ============ */
.btn{height:42px;padding:0 20px;border-radius:10px;font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  transition:transform .15s var(--ease),background .15s,border-color .15s,box-shadow .2s,color .15s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.pri{background:#fff;color:#000;box-shadow:0 0 0 1px #fff}
.btn.pri:hover{box-shadow:0 0 0 1px #fff,0 8px 28px rgba(255,255,255,.18);transform:translateY(-1px)}
.btn.pri:active{transform:translateY(0)}
.btn.sec{background:var(--card2);border:1px solid var(--b2);color:var(--t)}
.btn.sec:hover{border-color:var(--b4);background:var(--card3)}
.btn.line{border:1px solid #fff;color:#fff}
.btn.line:hover{background:#fff;color:#000}
.btn.ghost{color:var(--m);padding:0 12px}
.btn.ghost:hover{color:#fff}
.btn.sm{height:34px;padding:0 14px;font-size:11px}
.btn:disabled{opacity:.3;pointer-events:none}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--card);border:1px solid var(--b2)}
.seg button{height:26px;padding:0 11px;border-radius:7px;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--m);transition:.15s}
.seg button:hover{color:#fff}
.seg button.on{background:#fff;color:#000}

/* ============ login ============ */
#login{position:fixed;inset:0;display:grid;place-items:center;z-index:10;transition:opacity .45s var(--ease),transform .45s var(--ease)}
#login.out{opacity:0;transform:scale(1.04);pointer-events:none}
#login .lang{position:absolute;top:22px;right:24px}
.lbox{width:380px;display:flex;flex-direction:column;align-items:center;animation:rise .7s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.lbox .brand{align-items:center;margin-bottom:48px}
.field{position:relative;width:100%}
.field input{width:100%;height:52px;border-radius:12px;background:var(--card);border:1px solid var(--b2);padding:0 48px 0 46px;outline:none;font-size:16px;letter-spacing:.18em;transition:border-color .2s,box-shadow .2s}
.field input::placeholder{letter-spacing:.02em;font-size:14px;color:var(--d)}
.field input:focus{border-color:#8a8a8a;box-shadow:0 0 0 4px rgba(255,255,255,.05)}
.field>svg{position:absolute;left:16px;top:17px;width:18px;height:18px;color:var(--d)}
.lbox .btn{width:100%;height:50px;margin-top:12px;font-size:13px;letter-spacing:.3em}
.lerr{height:22px;margin-top:14px;font-size:12.5px;color:#cfcfcf;opacity:0;transition:opacity .2s;display:flex;align-items:center;gap:7px}
.lerr.show{opacity:1}
.lerr svg{width:14px;height:14px}
.lfoot{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:#333;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* ============ app shell ============ */
#app{position:fixed;inset:0;display:grid;grid-template-rows:88px 1fr;grid-template-columns:232px 1fr;opacity:0;transform:translateY(8px);transition:opacity .5s var(--ease) .1s,transform .5s var(--ease) .1s}
#app.in{opacity:1;transform:none}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 28px;border-bottom:1px solid var(--b1);background:rgba(5,5,5,.8);backdrop-filter:blur(12px);position:relative;z-index:2}
header .brand{margin-right:auto}
.chip{height:30px;padding:0 12px;border-radius:30px;border:1px solid var(--b2);display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#d8d8d8;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
.chip.dim{color:var(--m)}.chip.dim i{background:#555;box-shadow:none}
.chip.inv{background:#fff;color:#000;border-color:#fff;cursor:pointer}.chip.inv i{background:#000;box-shadow:none;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

aside{border-right:1px solid var(--b1);padding:18px 14px;display:flex;flex-direction:column;gap:3px;background:rgba(8,8,8,.6);position:relative;z-index:1}
.nav{height:44px;border-radius:10px;display:flex;align-items:center;gap:13px;padding:0 14px;color:var(--m);font-weight:600;font-size:13.5px;position:relative;transition:color .15s,background .15s}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{color:#fff;background:rgba(255,255,255,.03)}
.nav.on{color:#fff;background:var(--card2);box-shadow:inset 0 0 0 1px var(--b2)}
.nav.on::before{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:2px;border-radius:2px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8)}
.nav .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--d)}
.nav.on .cnt{color:#bbb}
aside .sp{flex:1}
.sidefoot{padding:14px;border-top:1px solid var(--b1);display:flex;align-items:center;gap:10px;color:var(--d);font-size:11px;font-family:var(--mono)}
.sidefoot button{margin-left:auto;color:var(--m);display:flex;align-items:center;gap:6px;font-family:inherit}
.sidefoot button:hover{color:#fff}
.sidefoot svg{width:14px;height:14px}

main{overflow:auto;position:relative;z-index:1}
.page{padding:28px 32px 120px;max-width:1400px;animation:pageIn .28s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px}
.ph h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.ph p{color:var(--m);font-size:13px;margin-top:6px;max-width:640px;line-height:1.5}
.ph .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

.card{background:var(--card);border:1px solid var(--b2);border-radius:14px;transition:border-color .2s,transform .2s var(--ease),box-shadow .2s}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--m)}
.muted{color:var(--m)}
.mono{font-family:var(--mono)}

/* dashboard */
.status{padding:22px 24px;margin-bottom:18px}
.status .top{display:flex;align-items:center;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:16px 18px;border-radius:12px;background:var(--card2);border:1px solid var(--b1)}
.stat .v{font-size:24px;font-weight:700;margin-top:10px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:13px;color:var(--m);font-weight:600}
.stat .v.glow{text-shadow:0 0 16px rgba(255,255,255,.35)}
.stat .s{color:var(--d);font-size:11.5px;margin-top:5px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.catc{padding:18px;cursor:pointer}
.catc:hover{border-color:var(--b4);transform:translateY(-2px)}
.catc .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--b2);margin-bottom:16px}
.catc.full .ic{background:#fff;color:#000;border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.2)}
.ic svg{width:18px;height:18px}
.catc h3{font-size:15px;font-weight:700}
.catc p{color:var(--m);font-size:12px;margin-top:4px;min-height:32px;line-height:1.4}
.catc .row{display:flex;align-items:center;margin-top:12px;font-size:11.5px;font-family:var(--mono);color:#bbb}
.catc .row span:last-child{margin-left:auto;color:var(--d)}
.bar{height:3px;border-radius:3px;background:var(--b2);overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:#fff;border-radius:3px;box-shadow:0 0 8px rgba(255,255,255,.6);transition:width .5s var(--ease)}
.box{padding:20px}
.box .hd{display:flex;align-items:center;margin-bottom:14px}
.box .hd .lbl{flex:1}
.act{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--b1);font-size:12.5px;line-height:1.45}
.act:first-child{border-top:0}
.act .k{width:18px;height:18px;flex:none;border-radius:50%;display:grid;place-items:center;margin-top:1px;border:1px solid var(--b3)}
.act .k svg{width:10px;height:10px}
.act.ok .k{background:#fff;color:#000;border-color:#fff}
.act.err .k{border-color:#fff;color:#fff}
.act .tm{margin-left:auto;color:var(--d);font-family:var(--mono);font-size:11px;white-space:nowrap;padding-left:10px}
.empty{padding:26px 10px;text-align:center;color:var(--d);font-size:12.5px}
.banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;border:1px solid #fff;background:rgba(255,255,255,.04);margin-bottom:18px;font-size:13px}
.banner svg{width:18px;height:18px;flex:none}
.banner .btn{margin-left:auto}

/* tweaks */
.tools{display:flex;gap:10px;align-items:center;margin-bottom:22px}
.search{position:relative;flex:1;max-width:380px}
.search input{width:100%;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--b2);padding:0 14px 0 40px;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--b4)}
.search svg{position:absolute;left:13px;top:11px;width:17px;height:17px;color:var(--d)}
.sect{margin-bottom:30px;scroll-margin-top:16px}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sh .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--b2);background:var(--card)}
.sh .ic svg{width:15px;height:15px}
.sh h2{font-size:15px;font-weight:700}
.sh .c{font-family:var(--mono);font-size:11.5px;color:var(--d)}
.sh .line{flex:1;height:1px;background:var(--b1)}
.sh .btn{height:28px;font-size:10px;padding:0 10px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.tw{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;position:relative}
.tw:hover{border-color:var(--b3)}
.tw.act1{background:linear-gradient(180deg,#131313,#0d0d0d);border-color:#3a3a3a}
.tw.pend{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 0 26px rgba(255,255,255,.05)}
.tw .r{display:flex;align-items:flex-start;gap:14px}
.tw h4{font-size:14.5px;font-weight:700;line-height:1.3}
.tw p{color:var(--m);font-size:12.5px;line-height:1.55}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{height:20px;padding:0 8px;border-radius:5px;display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--b3);color:var(--m)}
.tag.hi{border-color:#fff;color:#fff}
.tag.fill{background:#fff;color:#000;border-color:#fff}
.tag svg{width:10px;height:10px}
.tw .foot{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--b1);font-size:11.5px}
.now{display:flex;align-items:center;gap:7px;color:var(--m);font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.now i{width:6px;height:6px;border-radius:50%;background:#444}
.now.on{color:#fff}.now.on i{background:#fff;box-shadow:0 0 8px #fff}
.pendl{font-size:10px;font-weight:800;letter-spacing:.14em;color:#fff;text-transform:uppercase}
.linkb{color:var(--m);font-size:11.5px;margin-left:auto;display:flex;align-items:center;gap:4px}
.linkb:hover{color:#fff}
.linkb svg{width:12px;height:12px;transition:transform .2s}
.linkb.open svg{transform:rotate(180deg)}
.vals{border-radius:9px;background:#080808;border:1px solid var(--b1);padding:10px 12px;font-family:var(--mono);font-size:11px;line-height:1.7;color:#bdbdbd;word-break:break-all}
.vals div{display:flex;gap:10px}.vals div span:first-child{color:var(--d);flex:1}.vals div span:last-child{color:#fff;white-space:nowrap}

/* switch */
.sw{width:46px;height:26px;border-radius:26px;background:#141414;border:1px solid var(--b3);position:relative;flex:none;cursor:pointer;transition:background .25s var(--ease),border-color .25s,box-shadow .25s;margin-left:auto}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#5c5c5c;transition:transform .3s cubic-bezier(.3,1.35,.5,1),background .2s}
.sw:hover{border-color:var(--b4)}
.sw.on{background:#fff;border-color:#fff;box-shadow:0 0 16px rgba(255,255,255,.22)}
.sw.on::after{transform:translateX(20px);background:#000}
.sw.dis{opacity:.3;cursor:not-allowed}

/* action bar */
.abar{position:fixed;left:calc(232px + 32px);right:32px;bottom:22px;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 12px 12px 22px;border-radius:14px;background:rgba(17,17,17,.92);backdrop-filter:blur(14px);border:1px solid var(--b3);box-shadow:0 20px 60px rgba(0,0,0,.7);transform:translateY(140%);transition:transform .35s var(--ease)}
.abar.show{transform:none}
.abar .txt{font-size:13px}
.abar .txt b{font-family:var(--mono)}
.abar .txt span{color:var(--m);margin-left:8px}
.abar .sp{flex:1}

/* restore */
.sess{margin-bottom:10px;overflow:hidden}
.sess .r{display:flex;align-items:center;gap:16px;padding:16px 18px}
.sess .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--b2);flex:none}
.sess h4{font-size:14px;font-weight:700}
.sess .sub{font-size:12px;color:var(--m);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sess .sub b{color:#ddd;font-weight:600;font-family:var(--mono)}
.sess .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.sess .det{border-top:1px solid var(--b1);padding:6px 18px 14px;background:#090909}
.dt{padding:12px 0;border-top:1px solid var(--b1)}
.dt:first-child{border-top:0}
.dt .n{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:6px}
.dt .n .tag{margin-left:auto}
.chg{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 10px;font-family:var(--mono);font-size:11px;color:#999;align-items:center}
.chg .tg{color:var(--d);word-break:break-all}
.chg .o{color:#8a8a8a;text-align:right}.chg .ar{color:var(--d)}.chg .nw{color:#fff}
.sep{height:1px;background:var(--b1);margin:30px 0 24px}
.rp{display:flex;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--b1);font-size:13px}
.rp:first-child{border-top:0}
.rp .d{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--m)}

/* system */
.sgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.kv{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--b1);font-size:13px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--m);width:130px;flex:none}
.kv b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:58px 58px 44px;gap:8px;justify-content:center;margin:6px 0 12px}
.key{border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:17px;font-family:var(--mono);background:linear-gradient(180deg,#1a1a1a,#0f0f0f);border:1px solid var(--b3);box-shadow:0 4px 0 #000;color:#a8a8a8;transition:transform .05s,box-shadow .05s,background .05s,color .05s}
.key.down{transform:translateY(3px);background:#fff;color:#000;border-color:#fff;box-shadow:0 1px 0 #000,0 0 24px rgba(255,255,255,.4)}
.key.w{grid-column:2}.key.a{grid-column:1;grid-row:2}.key.s{grid-column:2;grid-row:2}.key.d{grid-column:3;grid-row:2}
.key.shift{grid-column:1/-1;grid-row:3;font-size:11px;letter-spacing:.3em}
.mk{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.mk .key{height:30px;padding:0 14px;font-size:10px;letter-spacing:.2em;box-shadow:0 3px 0 #000}
.big{font-size:32px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em}
.big small{font-size:13px;color:var(--m)}
.note{color:var(--d);font-size:11.5px;line-height:1.55}
.rowc{display:flex;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:16px}

/* settings */
.set{max-width:720px;display:flex;flex-direction:column;gap:14px}
.srow{display:flex;align-items:center;gap:18px;padding:18px 20px}
.srow h4{font-size:14px;font-weight:600}
.srow p{color:var(--m);font-size:12.5px;margin-top:3px;line-height:1.45}
.srow>div:first-child{flex:1}

/* modal */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:grid;place-items:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:560px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;border-radius:16px;background:#0b0b0b;border:1px solid var(--b3);box-shadow:0 40px 120px rgba(0,0,0,.9);animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
.mh{padding:24px 26px 0}
.mh h2{font-size:19px;font-weight:700}
.mh p{color:var(--m);font-size:13px;line-height:1.55;margin-top:8px}
.mb{padding:18px 26px;overflow:auto}
.mf{padding:0 26px 22px;display:flex;gap:10px;justify-content:flex-end}
.ml{margin-bottom:14px}
.ml .lbl{margin-bottom:8px;display:block}
.mli{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--b1);font-size:13px;margin-bottom:6px}
.mli .tag{margin-left:auto}
.info{display:flex;gap:10px;padding:12px 14px;border-radius:10px;border:1px dashed var(--b3);color:#bdbdbd;font-size:12px;line-height:1.5}
.info svg{width:16px;height:16px;flex:none;margin-top:1px}
.info.wrn{border:1px solid #fff;border-style:solid;color:#fff;background:rgba(255,255,255,.04)}
.mli svg,.rp svg,.dt .n svg,.cur svg{width:15px;height:15px;flex:none}
.prog{height:3px;border-radius:3px;background:var(--b2);overflow:hidden;margin:4px 0 14px}
.prog>div{height:100%;background:#fff;box-shadow:0 0 10px #fff;transition:width .35s var(--ease)}
.cur{display:flex;align-items:center;gap:10px;font-size:13px;color:#ddd;min-height:22px}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;animation:rot .75s linear infinite;flex:none}
.btn.pri .spin{border-color:rgba(0,0,0,.15);border-top-color:#000}
@keyframes rot{to{transform:rotate(360deg)}}
.log{margin-top:12px;display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
.ll{display:flex;gap:10px;align-items:flex-start;padding:6px 2px;font-size:12.5px;line-height:1.45;animation:pageIn .2s}
.ll .k{width:16px;height:16px;flex:none;border-radius:50%;display:grid;place-items:center;margin-top:1px;border:1px solid var(--b3)}
.ll .k svg{width:9px;height:9px}
.ll.ok .k{background:#fff;color:#000;border-color:#fff}
.ll.err{color:#fff}.ll.err .k{border-color:#fff}
.ll.warn{color:#cfcfcf}.ll.warn .k{border-style:dashed;border-color:#aaa}

#toasts{position:fixed;right:24px;bottom:24px;z-index:40;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{padding:11px 16px;border-radius:10px;background:#fff;color:#000;font-size:13px;font-weight:600;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:pop .25s var(--ease);display:flex;gap:9px;align-items:center;max-width:420px}
.toast.bad{background:#0d0d0d;color:#fff;border:1px solid #fff}
.toast svg{width:14px;height:14px;flex:none}

@media (max-width:1250px){.dgrid,.sgrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>

async function loadRPs(force){
  clearTimeout(rpTimer);let r;try{r=await mxRestorePoints(!!force)}catch(e){return}
  const el=$('#rplist');if(!el)return;
  if(r.loading&&!(r.items||[]).length){el.innerHTML=`<div class="empty">${t('loading')}</div>`;rpTimer=setTimeout(()=>loadRPs(false),900);return}
  const it=r.items||[];
  el.innerHTML=it.length?it.map(p=>`<div class="rp">${ic(p.mexxic?'shield':'dot')}<span>${esc(p.description)}</span>${p.mexxic?'<span class="tag fill">MEXXIC</span>':''}<span class="d">#${p.seq} · ${fmtDate(p.date)}</span></div>`).join('')
    :`<div class="empty">${r.error?esc(r.error):t('no_rps')}</div>`;
  if(r.loading)rpTimer=setTimeout(()=>loadRPs(false),900);
}

        <div class="kb"><div class="key w" id="k0">W</div><div class="key a" id="k1">A</div><div class="key s" id="k2">S</div><div class="key d" id="k3">D</div><div class="key shift" id="k4">SHIFT</div></div>

async function loadSys(){
  let s;try{s=await mxSysInfo()}catch(e){return}
  const el=$('#sysinfo');if(!el)return;
  const up=`${Math.floor(s.uptimeMin/60)} h ${s.uptimeMin%60} min`;
  el.innerHTML=[[t('k_os'),`${s.os} <span class="muted mono" style="font-size:11px">(${s.build})</span>`],[t('k_cpu'),`${esc(s.cpu)} <span class="muted mono" style="font-size:11px">· ${s.threads} threads</span>`],[t('k_gpu'),esc(s.gpu||'–')],
    [t('k_ram'),`${s.ramUsed.toFixed(1)} / ${s.ramTotal.toFixed(1)} GB <span class="muted mono" style="font-size:11px">· ${s.ramLoad}%</span>`],[t('k_plan'),esc(s.powerPlan||'–')],[t('k_uptime'),up],[t('k_admin'),s.admin?t('yes'):t('no')],[t('k_pc'),esc(s.computer)]]
    .map(([k,v])=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('');

    <div class="card srow"><div><h4>${t('perm')}</h4><p>${S.admin?t('perm_ok'):t('perm_no')}</p></div>${S.admin?`<span class="chip"><i></i>${t('admin')}</span>`:`<button class="btn line sm" onclick="mxRelaunchAdmin()">${ic('shield')}${t('relaunch')}</button>`}</div>
    <div class="card srow"><div><h4>${t('data')}</h4><p>${t('data_p')}<br><span class="mono" style="font-size:11px;color:var(--d)">%APPDATA%\\MexxicTweaks\\</span></p></div><button class="btn sec sm" onclick="mxOpenFolder()">${t('open_folder')}</button></div>
    <div class="card srow"><div><h4>${t('about')}</h4><p>${t('about_p',$('#ver').textContent)}</p></div><button class="btn sec sm" onclick="lock()">${t('lock')}</button><button class="btn line sm" onclick="mxQuit()">${t('quit')}</button></div>

/* =====================================================================
   Modals + jobs
   ===================================================================== */
function modal(html,job){closeModal();const o=document.createElement('div');o.className='ov';o.id='ov';if(job)o.dataset.job=1;o.innerHTML=`<div class="modal">${html}</div>`;document.body.append(o)}
function closeModal(){$('#ov')?.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!busy())closeModal()});

function askApply(){
  const p=pending(),ap=p.filter(x=>desired[x.id]),rs=p.filter(x=>!desired[x.id]);if(!p.length)return;
  const li=l=>l.map(x=>`<div class="mli">${ic(CAT_IC[x.category])}<span>${esc(tn(x))}</span>${x.requiresRestart?`<span class="tag hi">${t('tag_restart')}</span>`:`<span class="tag">${cn(x.category)}</span>`}</div>`).join('');
  modal(`<div class="mh"><h2>${t('confirm_apply_t')}</h2><p>${t('confirm_apply_p')}</p></div><div class="mb">
    ${ap.length?`<div class="ml"><span class="lbl">${t('sec_apply')} · ${ap.length}</span>${li(ap)}</div>`:''}
    ${rs.length?`<div class="ml"><span class="lbl">${t('sec_restore')} · ${rs.length}</span>${li(rs)}</div>`:''}
    <div class="info">${ic('shield')}<span>${t('safety_note')}${p.some(x=>x.requiresRestart)?'<br>'+t('restart_note'):''}</span></div></div>
    <div class="mf"><button class="btn sec" onclick="closeModal()">${t('cancel')}</button><button class="btn pri" id="goApply">${t('apply')}</button></div>`);
  $('#goApply').onclick=()=>runJob(()=>mxApply(ap.map(x=>x.id),rs.map(x=>x.id)),ap.length?'apply':'restore');
}
function askRestore(ids){
  if(!ids.length)return;
  modal(`<div class="mh"><h2>${t('confirm_restore_t')}</h2><p>${t('confirm_restore_p',ids.length)}</p></div>
    <div class="mb">${ids.map(id=>`<div class="mli">${ic('restore')}<span>${esc(nameOf(id))}</span></div>`).join('')}</div>
    <div class="mf"><button class="btn sec" onclick="closeModal()">${t('cancel').toUpperCase()}</button><button class="btn pri" id="goRes">${t('yes')}</button></div>`);
  $('#goRes').onclick=()=>runJob(()=>mxRestore(ids),'restore');
}
function createRP(){runJob(()=>mxCreateRestorePoint(),'rp')}
function askReboot(){
  modal(`<div class="mh"><h2>${t('reboot_t')}</h2><p>${t('reboot_p')}</p></div><div class="mf" style="margin-top:20px"><button class="btn sec" onclick="closeModal()">${t('later')}</button><button class="btn pri" onclick="mxReboot()">${t('restart')}</button></div>`);
}

async function runJob(start,kind){
  try{await start()}catch(e){toast(String(e.message||e)==='busy'?t('t_busy'):String(e.message||e),false);return}
  modal(`<div class="mh"><h2>${t('job_'+kind)}</h2></div><div class="mb" id="jb"><div class="cur"><span class="spin"></span><span>…</span></div></div><div class="mf hidden" id="jf"></div>`,true);
  const poll=async()=>{
    const j=await mxJob();const box=$('#jb');if(!box)return;
    const pct=j.total?Math.round(j.done/j.total*100):0;
    const cur=j.running&&!j.await?`<div class="cur"><span class="spin"></span><span>${j.current?esc(t('s_'+j.current,nameOf(j.currentArg||''))):'…'}</span><span class="mono muted" style="margin-left:auto;font-size:11px">${pct}%</span></div>`:
      !j.running?`<div class="cur" style="font-weight:600">${ic(j.cancelled?'dot':j.errors?'alert':'check').replace('<svg','<svg style="width:16px;height:16px"')}<span>${j.cancelled?t('done_cancel'):j.errors?t('done_err',j.errors):t('done_ok')}</span></div>`:'';
    const warn=j.await?`<div class="info wrn" style="margin:6px 0 10px">${ic('alert')}<div><b>${t('rp_warn_t')}</b><br>${esc(t('rp_warn_p',j.awaitMsg))}<br><br>${t('rp_warn_q')}</div></div>`:'';
    box.innerHTML=cur+`<div class="prog"><div style="width:${j.running?pct:100}%"></div></div>`+warn+
      `<div class="log">${j.log.map(l=>`<div class="ll ${l.kind}"><span class="k">${kindIc(l.kind)}</span><span>${esc(logText(l))}</span></div>`).join('')}</div>`;
    const f=$('#jf');
    if(j.await){f.classList.remove('hidden');f.innerHTML=`<button class="btn sec" onclick="mxConfirm(false)">${t('cancel')}</button><button class="btn pri" onclick="mxConfirm(true)">${t('continue_backup')}</button>`}
    else if(j.running){f.classList.add('hidden')}
    if(j.running){setTimeout(poll,220);return}
    delete $('#ov').dataset.job;
    f.classList.remove('hidden');
    f.innerHTML=j.needReboot?`<button class="btn sec" onclick="closeModal()">${t('later')}</button><button class="btn pri" onclick="mxReboot()">${t('restart_now')}</button>`:`<button class="btn pri" onclick="closeModal()">${t('done')}</button>`;
    S&&S.tweaks.forEach(x=>delete desired[x.id]);await refresh();
  };
  poll();
}

/* =====================================================================
   Live tools
   ===================================================================== */
let presses=[],prev=[];
function startLoops(){
  if(loops)return;loops=true;
  const kl=async()=>{
    if(PAGE==='system'&&$('#k0')){try{const k=await mxKeys();k.forEach((d,i)=>{const e=$('#k'+i);if(e)e.classList.toggle('down',!!d);if(d&&!prev[i])presses.push(performance.now())});prev=k}catch(e){}
      const now=performance.now();presses=presses.filter(x=>now-x<1000);const el=$('#kps');if(el)el.textContent=t('per_s',presses.length)}
    setTimeout(kl,14)};kl();
  const sl=async()=>{
    if(PAGE==='system'){
      try{const x=await mxTimer();const v=$('#tval');if(v){v.innerHTML=x.current.toFixed(3).replace('.',LANG==='de'?',':'.')+' <small>ms</small>';$('#tsw').classList.toggle('on',x.on);
        $('#tbar').style.width=Math.max(3,Math.min(100,(x.coarsest-x.current)/(x.coarsest-x.finest)*100))+'%'}}catch(e){}
      try{const f=await mxFiveM();const a=$('#fv');if(a){a.textContent=f.running?t('yes'):t('no');$('#pv').textContent=f.running?(f.high?t('yes'):t('normal')):'–'}}catch(e){}
      loadSys();
    }
    setTimeout(sl,1500)};sl();
  setInterval(()=>{if(!busy()&&!$('#ov')&&PAGE!=='tweaks')refresh()},10000);
}
async function toggleTimer(){const on=!$('#tsw').classList.contains('on');await mxSetTimer(on);$('#tsw').classList.toggle('on',on);toast(on?t('t_timer_on'):t('t_timer_off'))}
async function boost(){const n=await mxBoostFiveM();n?toast(t('t_boost',n)):toast(t('t_no_fivem'),false)}

document.addEventListener('contextmenu',e=>e.preventDefault());
applyStatic();
</script>
